# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cadvisor-machine-info
    main: ./cmd/cadvisor-machine-info
    binary: cadvisor-machine-info
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: cloneranger
    main: ./cmd/cloneranger
    binary: cloneranger
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: etcd-entry-size
    main: ./cmd/etcd-entry-size
    binary: etcd-entry-size 
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - "deploy/**"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
